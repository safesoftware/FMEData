# Configuration for the FMEData checks. See CHECKS.md at the repository root.

# Checks whose errors fail a pull request. FD006 (public safety) is always enforced.
# Every other check starts as a warning; add its id here once its findings are trusted.
# FD010: removing a file that lessons still link.
enforce = ["FD006", "FD010"]

# Hosts that refuse automated requests (403) but work in a browser.
bot_refusers = ["support.safe.com", "community.safe.com"]

# Courses in the lesson archive that aren't real courses (Skilljar copies and test courses).
ignore_courses = ["Clone of *", "*TEST*"]

# Accepted endings for a complete workspace's file name (FD011).
complete_suffixes = ["-complete"]

# Which course versions are current, where the archive's newest version isn't the answer. A course's current
# version is the one Skilljar publishes on its unversioned URL. Refreshed by hand from Skilljar's published
# catalog (CI can't call Skilljar): python -m fmedata_checks courses --fmetraining <archive>  (see CHECKS.md).
# archived: courses Skilljar publishes only on versioned URLs, so no version of them is current.
# current: course name -> current version. A course whose name has no version ("MCP and FME") is current in
# the archive folder for that version; adding the version to its name in Skilljar makes its entry unneeded.
# "annual" (set by hand, kept on regeneration) marks an unversioned course that is always current: FT006 holds
# its workspaces to each year's FME release, due by April 30.
[courses]
archived = [
    "Build Basic Automations",
    "Build Basic Self-Serve Workflows",
    "Build Versatile Automations",
    "Build Versatile Self-Serve Workflows",
    "Connect Automations with Job Orchestration",
    "Enhance Workflow Control with Parameters",
    "Publish Workflows to the Web",
    "Unlock the Power of FME Flow",
]

[courses.current]
"Continuous Data Processing with Streams - Live Online Course" = "2026.2"
"FME Accelerator" = "annual"
"MCP and FME" = "2026.2"

# Folders CI does not enforce. Findings there appear in the report's "Not enforced" section.
# FD006 still applies everywhere, and FD010 still warns.
[exempt]
"Resources/" = "Shared with other teams and partners; rarely used on the Academy"
"Workspaces/AcceleratorES/" = "Spanish partner Accelerator"

# Intentional exceptions. Every entry needs a reason.
[allow.paths]

[allow.urls]
