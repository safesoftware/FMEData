name: FMEData checks

# Checks the workspaces and files a pull request changes. See CHECKS.md.
on:
  pull_request:
  push:
    # main and year branches (2026, 2027, ...); see BRANCHES.md
    branches: [main, "20[0-9][0-9]"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main never are, so every merge is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out workspaces, the data manifest, and the check code only
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /CHECKS.md
            /Data/manifest.toml
            *.fmw
            *.fmwt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.3.3

      - name: Unit tests
        working-directory: .github/checks
        run: python -m pytest -q

      - name: Check the changes
        working-directory: .github/checks
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          # Lessons link main, so FD010 (removing a file a lesson links) is skipped for year branches (2026, ...).
          TARGET: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          # A new branch (all-zero "before") or a force-push (unknown "before") has no usable base: use HEAD~1.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          INDEX_ARGS=()
          if [[ "$TARGET" =~ ^20[0-9]{2}$ ]]; then INDEX_ARGS=(--index none); fi
          python -m fmedata_checks pr --repo ../.. --base "$BASE" "${INDEX_ARGS[@]}"
